services:
  redis:
    image: redis
    restart: always
    networks:
      - backend
    volumes:
      - ./saved/redis:/data

  # Guest accounts (decision #48). Local only: no published port, reached
  # from the server as postgres:5432. Match the major version to Railway's.
  # The server's .env needs
  # DATABASE_URL=postgres://postgres:plunderland@postgres:5432/plunderland
  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: plunderland
      POSTGRES_DB: plunderland
    networks:
      - backend
    volumes:
      - ./saved/postgres:/var/lib/postgresql/data

  battle-royale-server:
    image: node:24-alpine
    volumes:
      - ./battle-royale-server/:/app
    restart: always
    command: sh -c "npm i && npm run build && npm run start"
    working_dir: /app
    networks:
      - backend
    ports:
      - "8000:8000"
    env_file:
      - ./battle-royale-server/.env

networks:
  backend:
