<!doctype html>

<html>

    <head>
  <meta charset="utf-8">
  <!-- Without it a phone lays the page out 980 px wide and zooms out: a tiny HUD and taps that miss. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <link rel="icon" type="image/png" href="res/brand/favicon.png">
  <link rel="apple-touch-icon" href="res/brand/apple-touch-icon.png">
  <meta name="theme-color" content="#0B1220">
  <title>Plunderbots — Grab loot. Get out. Gear up.</title>
  <meta name="description" content="Choose your Plunderbot, collect loot, and battle rival bots and hostile machines. Explore deeper layers and extract to bank your loot and keep your gear.">
        <style>
        
        @font-face {
        font-family: 'Lilliput Steps';
        src: url('res/Lilliput Steps.otf') format('opentype')
        }

        /* The HUD's face (THEME.font). Unmodified, OFL: res/fonts/JetBrainsMono-OFL.txt */
        @font-face {
        font-family: 'JetBrains Mono';
        src: url('res/fonts/JetBrainsMono-Regular.woff2') format('woff2');
        font-weight: 400;
        }

        /* The game takes every touch: no double-tap zoom, pull-to-refresh or page scroll under a finger. */
        html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
        /* No text selection on a long press or a drag (CrazyGames' mobile requirements, #62); inputs stay editable. */
        body { -webkit-user-select: none; user-select: none; }
        canvas { touch-action: none; display: block; }
        
        </style>
        <script>
        // Inside a portal's iframe (CrazyGames, itch) a page that cannot scroll
        // hands arrow, space and wheel scrolling to the host page around it
        // (CrazyGames' common fixes, #62). Not on a focused control; the wheel only
        // over the canvas, so the lobby's panels still scroll.
        (function () {
          var keys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'PageUp', 'PageDown']
          window.addEventListener('keydown', function (e) {
            var t = e.target
            // A focused control keeps its own keys (space presses a button).
            var control = t instanceof HTMLElement && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT|BUTTON|A)$/.test(t.tagName))
            if (!control && keys.indexOf(e.key) >= 0) e.preventDefault()
          })
          window.addEventListener('wheel', function (e) {
            if (e.target instanceof HTMLCanvasElement) e.preventDefault()
          }, { passive: false })
        })()
        </script>
    </head>

</html>

</html>
